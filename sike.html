<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIKE — Brews &amp; Brains | NJIT SAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--pink:#ff2d95;--orange:#ff8a3d;--yellow:#ffd23f;--teal:#19e3d6;--bg:#0b0614;--muted:#bfb3d6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#6a2cff55,transparent 60%),var(--bg);
       color:#fff;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;
       padding:40px 16px 60px;text-align:center;overflow-x:hidden}
  .sike{font-family:Anton;font-size:clamp(110px,28vw,300px);line-height:.9;letter-spacing:.02em;
        background:linear-gradient(180deg,#ffe66b,#ff8a3d 45%,#ff2d95);-webkit-background-clip:text;background-clip:text;color:transparent;
        filter:drop-shadow(0 8px 0 #0008) drop-shadow(0 0 40px #ff2d9599);
        animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  .sub{margin-top:10px;font-size:clamp(16px,2.6vw,22px);font-weight:600;color:var(--muted);animation:fade .6s .4s both}
  .sub b{color:var(--teal)}
  h2{margin:34px 0 18px;font-family:Anton;font-size:clamp(34px,6vw,60px);letter-spacing:.03em;animation:fade .6s .6s both}
  h2 span{color:var(--yellow)}
  .poster{width:min(960px,100%);border-radius:16px;box-shadow:0 20px 70px #ff2d9555,0 0 0 1px #fff2;animation:fade .7s .8s both}
  .ph{width:min(560px,100%);aspect-ratio:8.5/11;border-radius:16px;border:2px dashed #fff4;display:none;place-items:center;color:#fff8;padding:20px}
  .btn{display:inline-block;margin-top:26px;padding:16px 28px;border-radius:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:14px;
       color:#fff;text-decoration:none;background:linear-gradient(90deg,var(--pink),var(--orange));box-shadow:0 10px 40px #ff2d9566}
  footer{margin-top:40px;font-size:12px;color:var(--muted)}
  footer img{height:40px;display:block;margin:0 auto 8px}
  @keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="sike">SIKE</div>
  <p class="sub">There's no GTA VI. But there <b>is</b> something better.</p>

  <h2>BREWS <span>&amp;</span> BRAINS</h2>
  <img class="poster" src="assets/poster.png" alt="Brews & Brains event poster"
       onerror="this.style.display='none';document.querySelector('.ph').style.display='grid'">
  <div class="ph">Add the poster at <code>assets/poster.png</code></div>

  <a class="btn" href="assets/poster.png" download="Brews_and_Brains_Poster.png">Save the Poster</a>

  <footer>
    <img src="assets/sac-logo.png" alt="NJIT SAC" onerror="this.style.display='none'">
    Brought to you by the NJIT Student Activities Council
  </footer>
</body>
</html>
